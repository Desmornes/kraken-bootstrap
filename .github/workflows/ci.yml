name: Premiere CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installer les dependances
        run: pip install -r requirements-dev.txt

      - name: Verifier le code avec Ruff
        run: ruff check .

      - name: Executer les tests
        run: pytest -q --junitxml=reports/junit.xml

      - name: Publier le rapport de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-tests
          path: reports/junit.xml
          
  build-push:
  needs: lint-test
  runs-on: ubuntu-latest

  steps:
    - name: Recuperer le code
      uses: actions/checkout@v7

    - name: Preparer le nom de l'image
      run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

    - name: Connexion a GHCR
      if: github.ref == 'refs/heads/main'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Construire et publier l'image Docker
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.ref == 'refs/heads/main' }}
        tags: ${{ env.IMAGE }}:${{ github.sha }}
        labels: |
          org.opencontainers.image.revision=${{ github.sha }}
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}